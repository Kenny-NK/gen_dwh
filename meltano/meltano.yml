send_anonymous_usage_stats: false
project_id: gen-dwh
requires_meltano: ">=4.0.0,<5.0.0"

default_environment: dev

environments:
  - name: dev
  - name: staging
  - name: prod

plugins:
  extractors:
    - name: tap-postgres
      variant: meltanolabs
      pip_url: meltanolabs-tap-postgres
      config:
        host: ${TAP_POSTGRES_HOST}
        port: ${TAP_POSTGRES_PORT}
        user: ${TAP_POSTGRES_USER}
        password: ${TAP_POSTGRES_PASSWORD}
        database: ${TAP_POSTGRES_DATABASE}
        default_replication_method: INCREMENTAL
    - name: tap-s3-csv
      variant: s7clarke10
      pip_url: pipelinewise-tap-s3-csv
      config:
        aws_access_key_id: ${TAP_S3_CSV_AWS_ACCESS_KEY_ID}
        aws_secret_access_key: ${TAP_S3_CSV_AWS_SECRET_ACCESS_KEY}
        aws_endpoint_url: ${TAP_S3_CSV_AWS_ENDPOINT_URL}
        bucket: ${TAP_S3_CSV_BUCKET}
        tables: ${TAP_S3_CSV_TABLES}
        warning_if_no_file: true
    - name: tap-jira
      variant: meltanolabs
      pip_url: https://github.com/MeltanoLabs/tap-jira/archive/refs/tags/v0.2.3.tar.gz
      config:
        domain: ${TAP_JIRA_DOMAIN}
        email: ${TAP_JIRA_EMAIL}
        api_token: ${TAP_JIRA_API_TOKEN}
        start_date: ${TAP_JIRA_START_DATE}
        page_size:
          issues: ${TAP_JIRA_PAGE_SIZE_ISSUES}
        stream_options:
          issues:
            jql: ${TAP_JIRA_STREAM_OPTIONS_ISSUES_JQL}

  loaders:
    - name: target-postgres
      variant: meltanolabs
      pip_url: meltanolabs-target-postgres
      config:
        host: ${TARGET_POSTGRES_HOST}
        port: ${TARGET_POSTGRES_PORT}
        user: ${TARGET_POSTGRES_USER}
        password: ${TARGET_POSTGRES_PASSWORD}
        database: ${TARGET_POSTGRES_DATABASE}
        default_target_schema: ${TARGET_POSTGRES_SCHEMA}
        add_record_metadata: true
